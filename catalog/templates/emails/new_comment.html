<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; border-top: 5px solid #0d6efd;">
        <h2 style="color: #0d6efd;">Новый комментарий к обзору</h2>
        <p>К обзору: <strong>{{ title }}</strong></p>
        <p>Автор: <strong>{{ author }}</strong></p>
        <hr style="border: 1px solid #eee;">
        <p><strong>Тема:</strong> {{ subject }}</p>
        <p><strong>Текст:</strong></p>
        <blockquote style="border-left: 4px solid #ccc; padding-left: 10px; color: #555; background: #f9f9f9; padding: 10px;">
            {{ text }}
        </blockquote>
        <hr style="border: 1px solid #eee;">
        <a href="{{ admin_link }}" style="display: inline-block; padding: 10px 20px; background: #198754; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold;">
            Перейти к модерации
        </a>
    </div>
</body>
</html>
